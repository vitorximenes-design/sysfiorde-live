name: Sysfiorde Live

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Extract Sysfiorde data
        env:
          SYSFIODE_URL: ${{ secrets.SYSFIODE_URL }}
        run: |
          python - <<'PY'
          import os
          import csv
          import requests
          from bs4 import BeautifulSoup

          url = os.environ["SYSFIODE_URL"]

          response = requests.get(
              url,
              timeout=180,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("STATUS:", response.status_code)
          print("TAMANHO HTML:", len(response.content))

          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          tables = soup.find_all("table")

          print("TABELAS:", len(tables))

          # Tabela 7 = documentos
          table = tables[7]

          rows = table.find_all("tr", recursive=False)

          print("TABELA 7 - LINHAS:", len(rows))

          output_file = "sysfiorde.csv"

          with open(
              output_file,
              "w",
              newline="",
              encoding="utf-8-sig"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "Razão Social",
                  "CNPJ",
                  "Descrição Docto",
                  "Tipo Docto",
                  "Dt.Criação Docto",
                  "Dt.Validade Docto",
                  "Usuário Inclusão Docto"
              ])

              registros = 0

              for row in rows:

                  cells = row.find_all(
                      ["th", "td"],
                      recursive=False
                  )

                  if len(cells) < 7:
                      continue

                  valores = []

                  for cell in cells[:7]:

                      texto = cell.get_text(
                          " ",
                          strip=True
                      )

                      valores.append(texto)

                  # Ignora linhas totalmente vazias
                  if not any(valores):
                      continue

                  writer.writerow(valores)

                  registros += 1

          print("ARQUIVO:", output_file)
          print("REGISTROS EXTRAÍDOS:", registros)

          PY

      - name: Show file information
        run: |
          ls -lh sysfiorde.csv
          echo "LINHAS:"
          wc -l sysfiorde.csv

      -       - name: Verify CSV
        run: |
          echo "ARQUIVO:"
          ls -lh sysfiorde.csv
          echo "PRIMEIRAS LINHAS:"
          head -n 3 sysfiorde.csv

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysfiorde-dados
          path: ./sysfiorde.csv
          if-no-files-found: error
          retention-days: 1
