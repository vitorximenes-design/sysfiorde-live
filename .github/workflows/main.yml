name: Test Sysfiorde

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Analyze Sysfiorde table
        env:
          SYSFIODE_URL: ${{ secrets.SYSFIODE_URL }}
        run: |
          python - <<'PY'
          import os
          import requests
          from bs4 import BeautifulSoup

          url = os.environ["SYSFIODE_URL"]

          response = requests.get(
              url,
              timeout=180,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("STATUS:", response.status_code)
          print("TAMANHO HTML:", len(response.content))

          soup = BeautifulSoup(response.text, "html.parser")
          tables = soup.find_all("table")

          print("TABELAS:", len(tables))

          table = tables[0]
          rows = table.find_all("tr")

          print("\n" + "=" * 100)
          print("TABELA 0")
          print("LINHAS:", len(rows))
          print("=" * 100)

          first_row = rows[0].find_all(["th", "td"])

          print("\nCOLUNAS ENCONTRADAS:", len(first_row))
          print("\nLISTA DE COLUNAS:\n")

          for i, cell in enumerate(first_row):
              text = cell.get_text(" ", strip=True)
              print(f"[{i}] {text}")

          print("\n" + "=" * 100)
          print("PRIMEIRO REGISTRO")
          print("=" * 100)

          if len(rows) > 1:
              second_row = rows[1].find_all(["th", "td"])

              for i, cell in enumerate(second_row):
                  text = cell.get_text(" ", strip=True)

                  if len(text) > 200:
                      text = text[:200] + "..."

                  print(f"[{i}] {text}")
          PY
