name: Test Sysfiorde

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run test
        env:
          SYSFIODE_URL: ${{ secrets.SYSFIODE_URL }}
        run: |
          python - <<'PY'
          import os
          import requests
          from bs4 import BeautifulSoup

          url = os.environ["SYSFIODE_URL"]

          response = requests.get(
              url,
              timeout=120,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("STATUS:", response.status_code)
          print("TAMANHO HTML:", len(response.content))

          soup = BeautifulSoup(response.text, "html.parser")
          tables = soup.find_all("table")

          print("TABELAS:", len(tables))

          for i, table in enumerate(tables):

              rows = table.find_all("tr")

              if len(rows) < 1000:
                  continue

              print("\n" + "=" * 80)
              print(f"TABELA {i}")
              print(f"LINHAS: {len(rows)}")
              print("=" * 80)

              for row_number, row in enumerate(rows[:3]):

                  cells = row.find_all(["th", "td"])

                  print(f"\nLINHA {row_number} | COLUNAS: {len(cells)}")

                  for column_number, cell in enumerate(cells):
                      text = cell.get_text(" ", strip=True)

                      if len(text) > 120:
                          text = text[:120] + "..."

                      print(f"[{column_number}] {text}")
          PY
